apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user
spec:
  serviceName: user-service
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
      - name: user-service
        image: ghcr.io/ds454/user-api:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: user-config
        - configMapRef:
            name: common-config
        ports:
        - containerPort: 50051
      - name: postgresql
        image: postgres:18.6
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: user-config