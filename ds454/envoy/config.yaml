apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  ENTRY_PORT: "80"

  # Auth routing config
  AUTH_SERVICE_CONTEXT_PATH: /ds454.locomotive.auth.v0_0_0.Auth/
  AUTH_PING_PATH: Ping
  AUTH_SERVICE_LOGIN_PATH: Login
  AUTH_SERVICE_HOSTNAME: auth-service
  AUTH_SERVICE_PORT: "50051"
  AUTH_SERVICE_HEALTH_METHOD: tcp
  AUTH_SERVICE_HEALTH_INTERVAL: 30s
  AUTH_SERVICE_SESSION_TOKEN_HEADER_KEY: x-session-token

  # User routing config
  USER_SERVICE_REGISTER_CONTEXT: /ds454.locomotive.user_api.v0_0_0.AddUserService/
  USER_SERVICE_REGISTER_PATH: AddUser
  USER_SERVICE_CONTEXT_PATH: /ds454.locomotive.user_api.v0_0_0.UserService/
  USER_SERVICE_HOSTNAME: user-service
  USER_SERVICE_PORT: "50051"
  USER_SERVICE_HEALTH_INTERVAL: 30s
  USER_SERVICE_HEALTH_METHOD: tcp

  # Game routing config
  GAME_SERVICE_CONTEXT_PATH: /ds454.locomotive.game_api.v0_0_0.GameService/
  GAME_SERVICE_HOSTNAME: game-api
  GAME_SERVICE_PORT: "50051"
  GAME_SERVICE_HEALTH_INTERVAL: 30s
  GAME_SERVICE_HEALTH_METHOD: tcp

  # Competition routing config
  COMPETITION_SERVICE_CONTEXT_PATH: /ds454.locomotive.competition.v0_0_0.CompetitionService/
  COMPETITION_SERVICE_HOSTNAME: competition
  COMPETITION_SERVICE_PORT: "50051"
  COMPETITION_SERVICE_HEALTH_INTERVAL: 30s
  COMPETITION_SERVICE_HEALTH_METHOD: tcp