apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: ghcr.io/ds454/auth:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: auth-config
        - configMapRef:
            name: common-config
        ports:
        - containerPort: 50051