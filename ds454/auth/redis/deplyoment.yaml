apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-redis
spec:
  serviceName: auth-redis-service
  replicas: 1
  selector:
    matchLabels:
      app: auth-redis
  template:
    metadata:
      labels:
        app: auth-redis
    spec:
      containers:
      - name: auth-redis
        image: bitnami/redis:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: auth-redis-config
        imagePullPolicy: Always
        ports:
        - containerPort: 6379