apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
data:
  GRPC_PORT: "50051"

  SESSION_TOKEN_KEY: x-session-token
  ENABLE_REFLECTION: "0"

  REDIS_HOST: auth-redis
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  REDIS_PASSWORD: ds454

  AUTH_SESSION_TOKEN_LENGTH: "32"
  
  # 1 day between session token refreshes
  AUTH_STORE_TTL_S: "86400"