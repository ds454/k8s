apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ds454-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: ds454.cluster.andrew.eslick.family
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: envoy-service
            port:
              number: 80
  tls:
    - hosts:
        - ds454.cluster.andrew.eslick.family
      secretName: ds454-tls-cert